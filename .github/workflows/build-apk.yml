name: Build APK

on:
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Android web assets (non-blocking)
        continue-on-error: true
        run: |
          set +e
          echo "== Debug paths =="
          pwd
          ls -la
          ls -la dist || true

          echo "== Copy web assets =="
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/* || true
          cp -R dist/. android/app/src/main/assets/public/ || true

          echo "== Write capacitor.config.json =="
          printf '%s\n' '{"appId":"app.lovable.ddb3d223b5b54708966b845064964fb6","appName":"souqalkul","webDir":"dist","bundledWebRuntime":false}' > android/app/src/main/assets/capacitor.config.json

          echo "== Verify assets =="
          ls -la android/app/src/main/assets || true
          ls -la android/app/src/main/assets/public || true
          exit 0

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
